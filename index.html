<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>АСТРА • Мобильное Приложение и Студия Тестирования</title>
  <meta http-equiv="refresh" content="0; url=astra_viewer_hub.html">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #0B0C12;
      color: #E6E6EB;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .launcher-card {
      background: #14151E;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #F5A623, #D48812);
      color: #0E0E12;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 1.5px;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #FFF;
      letter-spacing: -0.02em;
    }
    p {
      color: #8C8C9E;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .launch-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14.5px;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #784BF6, #5B2FE3);
      color: #FFF;
      box-shadow: 0 6px 24px rgba(120, 75, 246, 0.4);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(120, 75, 246, 0.6);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #E6E6EB;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #FFF;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="launcher-card">
    <div class="badge">ASTRA LIVE</div>
    <h1>АСТРА</h1>
    <p>Аутентичный цифровой аналог Moonly: ведическая астрология, лунный календарь, 78 карт Таро, руны и наставники советского кино.</p>

    <div class="btn-col">
      <a href="astra_viewer_hub.html" class="launch-btn btn-primary">
        🚀 Открыть Студию Просмотра
      </a>
      <a href="astra_app/astra_main_app.html" class="launch-btn btn-secondary">
        📱 Мобильное Приложение (Прямой доступ)
      </a>
      <a href="astra_app/astra_onboarding_demo.html" class="launch-btn btn-secondary">
        ✨ Интерактивный Онбординг
      </a>
      <a href="astra_app/astra_affirmation_ritual_demo.html" class="launch-btn btn-secondary">
        🧘 Ритуал Аффирмаций
      </a>
      <a href="astra_app/astra_video_loops_gallery.html" class="launch-btn btn-secondary">
        🎨 Галерея Видеолупов и Аватаров
      </a>
    </div>
  </div>

  <script>
    // Если автоматический редирект не сработал через meta, перенаправляем через JS
    window.location.replace("astra_viewer_hub.html");
